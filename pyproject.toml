[project]
name = "learn-minimind"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "DevilDouble12312", email = "DevilDouble12312@users.noreply.github.com" }
]
requires-python = ">=3.14"

dependencies = [
    "numpy>=2.3.4",
    "pandas>=2.3.3",
    "torch>=2.9.0",
    "transformers>=4.57.1",
    "datasets>=5.0",
    "swanlab==0.9.8",
]

# ===== CUDA / GPU 支持 =====
# PyPI 上的 torch 在 Windows 只有 CPU 轮子，装了也拿不到 GPU。
# CUDA 轮子只存在于 PyTorch 官方索引，所以必须显式指向它。
# 本机：RTX 4060 Laptop (8GB)
# 换其他 CUDA 版本：把 cu126 改成 cu130 / cu132 即可（须 <= 驱动支持的版本）
[tool.uv.sources]
torch = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://mirrors.aliyun.com/pytorch-wheels/cu126"
explicit = true
